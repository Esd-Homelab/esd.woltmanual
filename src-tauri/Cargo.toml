[package]
name = "esd_woltmanual"
version = "1.0.0"
description = "Woltmanual desktop app"
authors = ["Woltmanual"]
edition = "2021"

[lib]
name = "esd_woltmanual_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
md5 = "0.7"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"
